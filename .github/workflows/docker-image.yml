name: Sync metacubexd-server to Docker Hub

on:
  schedule:
    # 每 6 小时检查一次
    - cron: "0 */24 * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull source image
        run: |
          docker pull ghcr.io/metacubex/metacubexd-server:latest

      - name: Tag image
        run: |
          docker tag \
            ghcr.io/metacubex/metacubexd-server:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/metacubexd-server:latest

      - name: Push image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/metacubexd-server:latest
