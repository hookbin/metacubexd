name: Sync metacubexd-server

on:
  schedule:
    # 每 6 小时检查一次上游
    - cron: "0 */48 * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get latest version
        id: version
        run: |
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/metacubexd/releases/latest \
            | jq -r '.tag_name')

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Latest version: $VERSION"

      - name: Pull source image
        run: |
          docker pull \
            ghcr.io/metacubex/metacubexd-server:${{ steps.version.outputs.VERSION }}

      - name: Tag image
        run: |
          docker tag \
            ghcr.io/metacubex/metacubexd-server:${{ steps.version.outputs.VERSION }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/metacubexd-server:${{ steps.version.outputs.VERSION }}

          docker tag \
            ghcr.io/metacubex/metacubexd-server:${{ steps.version.outputs.VERSION }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/metacubexd-server:latest

      - name: Push version
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/metacubexd-server:${{ steps.version.outputs.VERSION }}

      - name: Push latest
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/metacubexd-server:latest